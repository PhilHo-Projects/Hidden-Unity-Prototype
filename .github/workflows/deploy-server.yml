name: Deploy Server

on:
  push:
    branches: [ main ]
    paths:
      - 'Server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Copy Server Files via SSH
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "Server/*"
        target: "/home/${{ secrets.SERVER_USER }}/HiddenGame/Server" # Adjust destination path
        strip_components: 1

    - name: Restart PM2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd ~/HiddenGame/Server
          npm install
          # Start if not running, otherwise restart
          pm2 describe hiddengame > /dev/null
          if [ $? -eq 0 ]; then
            pm2 restart hiddengame
          else
            pm2 start server.js --name "hiddengame"
            pm2 save
          fi
