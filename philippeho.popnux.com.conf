# Redirects all port 80 requests to https
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name philippeho.popnux.com;
    ssl_certificate /etc/letsencrypt/live/philippeho.popnux.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/philippeho.popnux.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /home/phil/projects/portfolio/dist;

    # Job Viewer
    location ^~ /job-viewer/ {
        alias /home/phil/projects/job-viewer/dist/;
        index index.html;
        try_files $uri $uri/ /job-viewer/index.html;
    }

    location ^~ /job-viewer/api/ {
        proxy_pass http://localhost:3004/job-viewer/api/;
        add_header Content-Security-Policy "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" always;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Personal SoundCloud
    location ^~ /personalsoundcloud/ {
        proxy_pass http://localhost:3000/personalsoundcloud/;
        add_header Content-Security-Policy "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" always;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Manga Tracker
    location ^~ /manga-tracker/ {
        proxy_pass http://localhost:3001/manga-tracker/;
        add_header Content-Security-Policy "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" always;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # HiddenGame WebSocket
    location /ws {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # MP3 Maker main app
    location ^~ /mp3maker/ {
        proxy_pass http://localhost:3003/mp3maker/;
        add_header Content-Security-Policy "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # MP3 Maker SSE stream
    location ^~ /mp3maker/progress/ {
        proxy_pass http://localhost:3003/mp3maker/progress/;
        add_header Content-Security-Policy "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_set_header Connection '';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.gz$ {
        add_header Content-Encoding gzip;
        gzip off;
        types {}
        default_type application/octet-stream;
    }

    location ~* .br$ {
        gzip off;
        add_header Content-Encoding br;
        default_type application/octet-stream;
    }
}
